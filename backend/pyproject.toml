[project]
name = "careercompass-api"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.135.1",
    "uvicorn[standard]==0.41.0",
    "SQLAlchemy==2.0.48",
    "alembic==1.18.4",
    "psycopg[binary]==3.3.3",
    "pydantic[email]==2.12.5",
    "pydantic-settings==2.13.1",
    "pwdlib[argon2]==0.3.0",
    "python-multipart==0.0.22",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.15.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
